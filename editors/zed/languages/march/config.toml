name = "March"
grammar = "march"
path_suffixes = ["march"]
line_comments = ["-- "]
tab_size = 2
hard_tabs = false
word_characters = ["?", "!", "-", "+", "*", "/", ">", "<", "'", "=", ".", ":", "@", "_"]
brackets = [
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "{", end = "}", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]

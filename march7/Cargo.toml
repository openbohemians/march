[package]
name = "march7"
version = "0.1.0"
edition = "2024"
default-run = "march7"

[dependencies]
sha2 = "0.10"

# Persistent vectors for March's arrays (docs/ARRAYS.md); tests also check
# that dictionary names hash exactly as merkle-champ places keys. From the
# sibling checkout until merkle-champ 0.2 is published.
merkle-champ = { path = "../../merkle-champ" }

[[bin]]
name = "march7-seed"
path = "tools/seed.rs"
